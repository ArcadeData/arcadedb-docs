  <text x="565" y="146" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve" font-size="13.5" fill="#e2e8f0">CALL algo.cch.shortestPath(tallahassee,</text>
  <text x="565" y="168" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve" font-size="13.5" fill="#e2e8f0">     coralGables, 'ROAD', 'minutes', 'OUT')</text>
  <text x="565" y="190" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve" font-size="13.5" fill="#60a5fa">8 h 18 min  via I-75 and the Turnpike</text>
  <text class="a" style="animation-name:l1" x="565" y="224" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve" font-size="13.5" fill="#94a3b8">// 4 hours of queue south of Orlando</text>
  <text class="a" style="animation-name:l1" x="565" y="246" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve" font-size="13.5" fill="#e2e8f0">MATCH (:Junction {id: 702459})</text>
  <text class="a" style="animation-name:l1" x="565" y="268" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve" font-size="13.5" fill="#e2e8f0">      -[r:ROAD]-&gt;(:Junction {id: 702911})</text>
  <text class="a" style="animation-name:l1" x="565" y="290" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve" font-size="13.5" fill="#e2e8f0">SET r.minutes = 240</text>
  <text class="a" style="animation-name:l2" x="565" y="312" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve" font-size="13.5" fill="#fbbf24">committed</text>
  <text class="a" style="animation-name:l3" x="565" y="334" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve" font-size="13.5" fill="#fbbf24">hierarchy caught up in 0.9 ms</text>
  <text class="a" style="animation-name:l4" x="565" y="356" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve" font-size="13.5" fill="#e2e8f0">CALL algo.cch.shortestPath(...)</text>
  <text class="a" style="animation-name:l5" x="565" y="378" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve" font-size="13.5" fill="#34d399">8 h 20 min  via I-10 and I-95</text>
  <text class="a" style="animation-name:l5" x="565.0" y="500.0" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">Only the arcs above the jammed road are re-priced.</text>
  <text class="a" style="animation-name:l5" x="565.0" y="520.0" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="start">Queries never wait: meanwhile, Dijkstra answers.</text>
  <text x="20.0" y="38.0" font-size="24" font-weight="800" fill="#0f172a" text-anchor="start">Live traffic: one update, a new route a millisecond later</text>
  <text x="20.0" y="64.0" font-size="16" font-weight="500" fill="#475569" text-anchor="start">The C in CCH is for customizable: the hierarchy is kept, only the costs above a changed road are recomputed.</text>

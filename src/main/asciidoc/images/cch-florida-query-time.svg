  <text x="100" y="124.0" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end">1 s</text>
  <text x="110" y="452" font-size="13" font-weight="600" fill="#94a3b8">Tallahassee</text>
  <text x="880" y="452" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="end">farthest destination</text>

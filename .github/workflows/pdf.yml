name: Generate PDF

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    # Skip self-trigger when this workflow's own commit lands.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@b1de5da23ed0a6d14e0aeee8ed52fdd87af2363c # v2.0.2

      - name: Install D2
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s --
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          d2 --version

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install npm dependencies
        run: npm ci

      - name: Regenerate Antora content from src/main/asciidoc
        run: bash scripts/migrate.sh

      - name: Build PDF (asciidoctorj-pdf via Maven)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mvn generate-resources

      - name: Commit ArcadeDB-Manual.pdf
        run: |
          if [ ! -f "target/generated-docs/ArcadeDB-Manual.pdf" ]; then
            echo "PDF not generated"
            exit 1
          fi
          cp target/generated-docs/ArcadeDB-Manual.pdf ArcadeDB-Manual.pdf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ArcadeDB-Manual.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "Update ArcadeDB-Manual.pdf [skip ci]"
          git push

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="trfTitle trfDesc" font-family="Inter, 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title id="trfTitle">A traffic jam re-routes Tallahassee to Coral Gables about a millisecond after the commit</title>
  <desc id="trfDesc">Map of Florida. The fastest route from Tallahassee to Coral Gables, 8 h 18 min, runs down I-75 and the Florida Turnpike. A four-hour jam on the Turnpike south of Orlando is written to the database with one update. The contraction hierarchy re-prices only the arcs above that road, in about a millisecond, and the next query takes I-10 and I-95 down the Atlantic coast instead: 8 h 20 min.</desc>

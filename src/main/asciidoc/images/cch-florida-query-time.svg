<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="flaTitle flaDesc" font-family="Inter, 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title id="flaTitle">CCH against Dijkstra and A* on the Florida road network</title>
  <desc id="flaDesc">Query time from Tallahassee to twelve destinations at increasing distance on the DIMACS Florida road network, 1.07 million junctions and 2.7 million road segments, on a logarithmic scale. Dijkstra grows from 7.8 to 104 milliseconds as the destination moves away. A* starts faster, 3.1 milliseconds, but grows to 132 milliseconds, more than Dijkstra for the farthest destinations. The Customizable Contraction Hierarchy stays between 0.010 and 0.041 milliseconds. Tallahassee to Coral Gables: 0.039 ms with CCH, 99 ms with Dijkstra, 121 ms with A*.</desc>
  <rect width="1000" height="560" fill="#ffffff"/>
  <defs><style><![CDATA[.a{animation-duration:12.0s;animation-iteration-count:infinite;animation-timing-function:ease-out}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
@keyframes ld{0%,5.00%{stroke-dashoffset:1}25.00%,93.0%{stroke-dashoffset:0}97.0%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes la{0%,5.00%{stroke-dashoffset:1}25.00%,93.0%{stroke-dashoffset:0}97.0%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes lc{0%,5.00%{stroke-dashoffset:1}25.00%,93.0%{stroke-dashoffset:0}97.0%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes tx{0%,26.67%{opacity:0}28.75%,93.0%{opacity:1}97.0%,100%{opacity:0}}]]></style></defs>
  <text x="20" y="38" font-size="24" font-weight="800" fill="#0f172a">Florida, 1.07M junctions: CCH stays flat, Dijkstra and A* climb</text>
  <text x="20" y="64" font-size="16" font-weight="500" fill="#475569">Time per query from Tallahassee, by distance of the destination, log scale. DIMACS USA-road-d.FLA, 2.7M arcs.</text>

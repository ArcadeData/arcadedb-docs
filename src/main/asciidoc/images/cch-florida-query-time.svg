  <text x="773.5" y="202.3" font-size="14" font-weight="700" fill="#F59E0B" text-anchor="end">Dijkstra 99 ms</text>
  <text x="775.5" y="372.5" font-size="14" font-weight="700" fill="#0066CC" text-anchor="end">0.039 ms</text>

  <text x="20" y="490" font-size="13" font-weight="500" fill="#94a3b8">CCHRoadNetworkBenchmark, Apple M5 Pro, median of 3 runs. From Tallahassee to the quantiles of its shortest-path tree, plus Coral Gables.</text>
  <text x="20" y="510" font-size="13" font-weight="500" fill="#94a3b8">A* estimates with the straight line, scaled to 67% so that it never overshoots a road segment: that is what keeps it exact.</text>
  <text x="20" y="530" font-size="13" font-weight="500" fill="#94a3b8">Memory per query: Dijkstra 11 to 44 MB, A* 9 to 52 MB, CCH 6 to 43 KB. Through the database, CCH: 0.04 to 0.06 ms.</text>
